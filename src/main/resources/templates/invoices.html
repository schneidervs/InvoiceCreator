<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container">
        <h1 class="mb-4">Invoices</h1>

        <form th:action="@{/invoices}" method="get" class="row g-2 mb-3">
            <div class="col-auto">
                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search by client">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </div>
        </form>

        <div class="mb-3">
            <a th:href="@{/invoices/new}" class="btn btn-primary">Create New Invoice</a>
        </div>

        <table class="table table-striped">
            <thead class="table-light">
                <tr>
                    <th>Number</th>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Gross</th>
                    <th>Creator</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="invoice : ${invoices}">
                    <td th:text="${invoice.invoiceNumber}">INV-000</td>
                    <td th:text="${invoice.issueDate}">2025-06-13</td>
                    <td th:text="${invoice.clientData}">Client Name</td>
                    <td th:text="${invoice.grossAmount}">123.45</td>
                    <td th:text="${invoice.createdBy}">admin</td>
                </tr>
                <tr th:if="${#lists.isEmpty(invoices)}">
                    <td colspan="5" class="text-center">No invoices found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
