<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">Edit Company</h1>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        <span th:if="${param.error == 'name_exists'}">Company with this name already exists.</span>
        <span th:if="${param.error == 'nip_exists'}">Company with this NIP already exists.</span>
    </div>

    <form th:action="@{/my-company/update}" th:object="${company}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label for="companyId" class="form-label">ID</label>
            <input id="companyId" type="text" th:value="${company.id}" class="form-control" readonly />
        </div>

        <div class="col-md-6">
            <label for="name" class="form-label">Company Name *</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
        </div>

        <div class="col-md-6">
            <label for="nip" class="form-label">NIP</label>
            <input type="text" th:field="*{nip}" class="form-control" id="nip" placeholder="1234567890">
        </div>

        <div class="col-md-8">
            <label for="street" class="form-label">Street</label>
            <input type="text" th:field="*{street}" class="form-control" id="street">
        </div>

        <div class="col-md-4">
            <label for="houseNumber" class="form-label">House Number</label>
            <input type="text" th:field="*{houseNumber}" class="form-control" id="houseNumber">
        </div>

        <div class="col-md-4">
            <label for="postalCode" class="form-label">Postal Code</label>
            <input type="text" th:field="*{postalCode}" class="form-control" id="postalCode" placeholder="00-000">
        </div>

        <div class="col-md-8">
            <label for="city" class="form-label">City</label>
            <input type="text" th:field="*{city}" class="form-control" id="city">
        </div>

        <div class="col-md-6">
            <label for="phoneFax" class="form-label">Phone/Fax</label>
            <input type="text" th:field="*{phoneFax}" class="form-control" id="phoneFax" placeholder="+48 123 456 789">
        </div>

        <div class="col-md-6">
            <label for="region" class="form-label">Region</label>
            <input type="text" th:field="*{region}" class="form-control" id="region">
        </div>

        <div class="col-md-6">
            <label for="bdoRegistrationNumber" class="form-label">BDO Registration Number</label>
            <input type="text" th:field="*{bdoRegistrationNumber}" class="form-control" id="bdoRegistrationNumber">
        </div>

        <div class="col-md-6">
            <label for="bankName" class="form-label">Bank Name</label>
            <input type="text" th:field="*{bankName}" class="form-control" id="bankName">
        </div>

        <div class="col-md-6">
            <label for="bankAccountNumber" class="form-label">Bank Account Number</label>
            <input type="text" th:field="*{bankAccountNumber}" class="form-control" id="bankAccountNumber" placeholder="PL 00 0000 0000 0000 0000 0000 0000">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Update</button>
            <a th:href="@{/my-company}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
