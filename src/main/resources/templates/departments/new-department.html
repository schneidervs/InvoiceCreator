<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Department</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">Create New Department</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/departments/save}" th:object="${department}" method="post" class="row g-3">
        <div class="col-md-12">
            <label for="name" class="form-label">Department Name</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/departments}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
