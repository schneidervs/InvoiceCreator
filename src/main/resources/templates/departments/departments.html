<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">Department Management</h1>

    <div class="mb-3">
        <a th:href="@{/departments/new}" class="btn btn-success">Create New Department</a>
        <a th:href="@{/home}" class="btn btn-primary ms-2">Back to Home</a>
    </div>

    <table class="table table-striped">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="department : ${departments}">
            <td th:text="${department.id}">1</td>
            <td th:text="${department.name}">IT Department</td>
            <td>
                <a th:href="@{'/departments/edit/' + ${department.id}}" class="btn btn-sm btn-primary me-1">Edit</a>
                <form th:action="@{|/departments/delete/${department.id}|}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this department?');"
                      style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(departments)}">
            <td colspan="3" class="text-center">No departments found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
