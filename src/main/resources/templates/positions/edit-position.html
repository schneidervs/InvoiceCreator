<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Position</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">Edit Position</h1>

    <form th:action="@{/positions/update}" th:object="${position}" method="post" class="row g-3">
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label for="positionId" class="form-label">ID</label>
            <input id="positionId" type="text" th:value="${position.id}" class="form-control" readonly />
        </div>

        <div class="col-md-12">
            <label for="name" class="form-label">Position Name</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/positions}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
