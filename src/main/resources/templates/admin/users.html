<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">User Management</h1>

    <div class="mb-3">
        <a th:href="@{/admin/users/new}" class="btn btn-success">Create New User</a>
    </div>

    <table class="table table-striped">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Roles</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username}">admin</td>
            <td>
                <span th:each="role : ${user.roles}" th:text="${role}" class="badge bg-secondary me-1"></span>
            </td>
            <td>
                <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-sm btn-primary me-1">Edit</a>
                <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post"
                      onsubmit="return confirm('Are you sure?')" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="4" class="text-center">No users found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
