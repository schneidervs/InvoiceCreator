<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">Edit User</h1>

    <form th:action="@{/admin/users/update}" th:object="${user}" method="post" class="row g-3">
        <input type="hidden" name="id" th:value="${user.id}"/>
        <input type="hidden" th:field="*{id}"/>

        <div class="col-md-6">
            <label for="userId" class="form-label">ID</label>
            <input id="userId" type="text" th:value="${user.id}" class="form-control" readonly />
        </div>
        <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input id="username" type="text" th:field="*{username}" class="form-control" readonly/>
        </div>

        <div class="col-md-6">
            <label for="userRoles" class="form-label">Roles</label>
            <select id="userRoles" multiple th:field="*{roles}" class="form-select">
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">
                </option>
            </select>
        </div>

        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabled">
            <label class="form-check-label" for="enabled">Enabled</label>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{accountNonExpired}" id="accountNonExpired">
            <label class="form-check-label" for="accountNonExpired">Account Non Expired</label>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{accountNonLocked}" id="accountNonLocked">
            <label class="form-check-label" for="accountNonLocked">Account Non Locked</label>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{credentialsNonExpired}" id="credentialsNonExpired">
            <label class="form-check-label" for="credentialsNonExpired">Credentials Non Expired</label>
        </div>

        <h5 class="mt-4">User Details</h5>

        <div class="col-md-6">
            <label for="firstName" class="form-label">First Name</label>
            <input id="firstName" name="firstName" type="text" th:value="${user.userData.firstName}" class="form-control"/>
        </div>
        <div class="col-md-6">
            <label for="lastName" class="form-label">Last Name</label>
            <input id="lastName" name="lastName" type="text" th:value="${user.userData.lastName}" class="form-control"/>
        </div>

        <div class="col-md-6">
            <label for="position" class="form-label">Position</label>
            <select id="position" name="positionId" class="form-select">
                <option th:each="pos : ${positions}" th:value="${pos.id}" th:text="${pos.name}" th:selected="${user.userData.position?.id == pos.id}">
                </option>
            </select>
        </div>

        <div class="col-md-6">
            <label for="department" class="form-label">Department</label>
            <select id="department" name="departmentId" class="form-select">
                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${user.userData.department?.id == dept.id}">
                </option>
            </select>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
