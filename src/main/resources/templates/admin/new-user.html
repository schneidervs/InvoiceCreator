<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1 class="mb-4">Create New User</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/admin/users/save}" th:object="${user}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" id="username" required>
        </div>
        <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" id="password" required>
        </div>
        <div class="col-md-6">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" name="firstName" class="form-control" id="firstName">
        </div>
        <div class="col-md-6">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" name="lastName" class="form-control" id="lastName">
        </div>
        <div class="col-md-6">
            <label for="roles" class="form-label">Role</label>
            <select th:field="*{roles}" class="form-select" id="roles">
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">ROLE_USER</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="position" class="form-label">Position</label>
            <select name="positionId" class="form-select" id="position">
                <option value="">Select Position</option>
                <option th:each="position : ${positions}" th:value="${position.id}" th:text="${position.name}">Position</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="department" class="form-label">Department</label>
            <select name="departmentId" class="form-select" id="department">
                <option value="">Select Department</option>
                <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}">Department</option>
            </select>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{accountNonExpired}" id="accountNonExpired">
            <label class="form-check-label" for="accountNonExpired">Account Non Expired</label>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{accountNonLocked}" id="accountNonLocked">
            <label class="form-check-label" for="accountNonLocked">Account Non Locked</label>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{credentialsNonExpired}" id="credentialsNonExpired">
            <label class="form-check-label" for="credentialsNonExpired">Credentials Non Expired</label>
        </div>
        <div class="col-md-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabled">
            <label class="form-check-label" for="enabled">Enabled</label>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
