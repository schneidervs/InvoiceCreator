<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xml:lang="en">
<head>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1>Welcome, <span th:text="${#authentication.principal.username}">User</span>!</h1>
    <nav class="mt-3">
        <a th:href="@{/invoices}" class="btn btn-outline-primary">Invoices</a>

        <!-- Ссылка на управление пользователями видна только админам -->
        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a th:href="@{/admin/users}" class="btn btn-outline-warning">Manage Users</a>
        </span>

        <!-- Ссылка на управление отделами видна только админам -->
        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/departments}" class="btn btn-outline-warning ms-2">Manage Departments</a>
        </span>
    </nav>
</div>
</body>
</html>
