<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xml:lang="en">
<head>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
<div class="container">
    <h1>Welcome, <span th:text="${#authentication.principal.username}">User</span>!</h1>
    <nav class="mt-3">
        <a th:href="@{/invoices}" class="btn btn-outline-primary">Invoices</a>

        <!-- Ссылка на управление пользователями видна только админам -->
        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a th:href="@{/admin/users}" class="btn btn-outline-warning">Manage Users</a>
        </span>

        <!-- Ссылка на управление отделами видна только админам -->
        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/departments}" class="btn btn-outline-warning ms-2">Manage Departments</a>
        </span>

        <!-- Ссылка на управление должностями видна только админам -->
        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/positions}" class="btn btn-outline-warning ms-2">Manage Positions</a>
        </span>

        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/my-company}" class="btn btn-outline-warning ms-2">Manage Company</a>
        </span>

        <form th:action="@{/perform_logout}" method="post" style="display: inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-danger ms-2"
                    onclick="return confirm('Are you sure you want to log out?');">
                Logout
            </button>
        </form>
    </nav>
</div>
</body>
</html>
