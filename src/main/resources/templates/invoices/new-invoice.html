<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Create New Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow">
                <div class="card-header">
                    <h2 class="text-center">Create New Invoice</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/invoices/save}" th:object="${invoice}" method="post" autocomplete="off">
                        <!-- Invoice Number and Dates -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="invoiceNumber" class="form-label">Invoice Number</label>
                                <input type="text" class="form-control" id="invoiceNumber" th:field="*{invoiceNumber}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="issueDate" class="form-label">Issue Date</label>
                                <input type="date" class="form-control" id="issueDate" th:field="*{issueDate}" th:value="${#temporals.format(today, 'yyyy-MM-dd')}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="dueDate" class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="dueDate" th:field="*{dueDate}" th:value="${#temporals.format(dueDate, 'yyyy-MM-dd')}" required>
                            </div>
                        </div>

                        <!-- Company and Client Data -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="companyData" class="form-label">Your Company Details</label>
                                <textarea class="form-control" id="companyData" th:field="*{companyData}" rows="3" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="clientData" class="form-label">Client Details</label>
                                <textarea class="form-control" id="clientData" th:field="*{clientData}" rows="3" required></textarea>
                            </div>
                        </div>

                        <!-- Service Description -->
                        <div class="mb-3">
                            <label for="serviceDescription" class="form-label">Service Description</label>
                            <textarea class="form-control" id="serviceDescription" th:field="*{serviceDescription}" rows="3" required></textarea>
                        </div>

                        <div class="col-md-3">
                            <label for="createdBy" class="form-label">Author</label>
                            <input type="text" class="form-control" id="createdBy" th:field="*{createdBy}" readonly>
                        </div>

                        <!-- Amounts -->
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="netAmount" class="form-label">Net Amount</label>
                                <input type="number" step="0.01" class="form-control" id="netAmount" th:field="*{netAmount}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="grossAmount" class="form-label">Gross Amount</label>
                                <input type="number" step="0.01" class="form-control" id="grossAmount" th:field="*{grossAmount}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="amountInWords" class="form-label">Amount in Words</label>
                                <input type="text" class="form-control" id="amountInWords" th:field="*{amountInWords}" required>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a href="/invoices" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Invoice</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
