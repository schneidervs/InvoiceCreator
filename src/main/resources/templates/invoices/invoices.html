<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container">
        <h1 class="mb-4">Invoices</h1>

        <form th:action="@{/invoices}" method="get" class="row g-2 mb-3">
            <div class="col-auto">
                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search by client">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </div>
        </form>

        <div class="mb-3">
            <a th:href="@{/invoices/new}" class="btn btn-success">Create New Invoice</a>
            <a th:href="@{/home}" class="btn btn-primary ms-2">Back to Home</a>
        </div>

        <table class="table table-striped">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Number</th>
                    <th>Date</th>
                    <th>Client</th>
                    <th>Company</th>
                    <th>Description</th>
                    <th>Net</th>
                    <th>Gross</th>
                    <th>Amount in Words</th>
                    <th>Due Date</th>
                    <th>Creator</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="invoice : ${invoices}">
                    <td th:text="${invoice.id}">1</td>
                    <td th:text="${invoice.invoiceNumber}">INV-000</td>
                    <td th:text="${invoice.issueDate}">2025-06-13</td>
                    <td th:text="${invoice.clientData}">Client Name</td>
                    <td th:text="${invoice.myCompany?.name ?: 'N/A'}">Company Name</td>
                    <td th:text="${invoice.serviceDescription}">Service Description</td>
                    <td th:text="${invoice.netAmount}">100.00</td>
                    <td th:text="${invoice.grossAmount}">123.45</td>
                    <td th:text="${invoice.amountInWords}">One hundred twenty-three PLN</td>
                    <td th:text="${invoice.dueDate}">2025-06-20</td>
                    <td th:text="${invoice.createdBy}">admin</td>
                    <td>
                        <!-- Edit для STAFF и ADMIN -->
                        <a th:if="${#authorization.expression('hasRole(''ROLE_STAFF'') or hasRole(''ROLE_ADMIN'')')}"
                           th:href="@{'/invoices/edit/' + ${invoice.id}}"
                           class="btn btn-sm btn-primary me-1">Edit</a>

                        <!-- Delete только для ADMIN -->
                        <form th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}"
                              th:action="@{'/invoices/delete/' + ${invoice.id}}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this invoice?');"
                              style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(invoices)}">
                    <td colspan="5" class="text-center">No invoices found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
