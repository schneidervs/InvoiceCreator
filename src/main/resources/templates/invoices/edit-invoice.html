<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h1>Edit Invoice</h1>

    <form th:action="@{/invoices/update}" th:object="${invoice}" method="post" class="mb-3">
        <div class="mb-3">
            <label>ID</label>
            <input type="text" th:field="*{id}" class="form-control" readonly/>
        </div>
        <div class="mb-3">
            <label>Invoice Number</label>
            <input type="text" th:field="*{invoiceNumber}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Issue Date</label>
            <input type="date" th:field="*{issueDate}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Client Data</label>
            <input type="text" th:field="*{clientData}" class="form-control"/>
        </div>
        <div class="mb-3">
            <label>Company Data</label>
            <select class="form-select" th:field="*{myCompany.id}" required>
                <option value="" disabled>Select your company</option>
                <option th:each="company : ${companies}"
                        th:value="${company.id}"
                        th:text="${company.name}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Service Description</label>
            <textarea th:field="*{serviceDescription}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>Net Amount</label>
            <input type="number" step="0.01" th:field="*{netAmount}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Gross Amount</label>
            <input type="number" step="0.01" th:field="*{grossAmount}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Amount in Words</label>
            <input type="text" th:field="*{amountInWords}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Due Date</label>
            <input type="date" th:field="*{dueDate}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Created By</label>
            <input type="text" th:field="*{createdBy}" class="form-control"/>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/invoices}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
</body>
</html>
